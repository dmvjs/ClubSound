name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 25

    env:
      SCHEME: TypeBeat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show environment
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      # Pin to a concrete simulator by UDID rather than a device name like
      # "iPhone 16": the available device set changes with every Xcode bump
      # (the iPhone 16 family vanished under Xcode 26), which broke the build
      # before it ever reached the tests. Pick the first available iPhone.
      - name: Select simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c 'import sys, json; devs = json.load(sys.stdin)["devices"]; cands = [d["udid"] for rt, ds in devs.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]; print(cands[0] if cands else "")')
          if [ -z "$UDID" ]; then echo "No iPhone simulator available"; exit 1; fi
          echo "Selected simulator UDID: $UDID"
          echo "DESTINATION=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath build \
            build

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath build \
            test
